openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: billing
    description: Cadence subscription billing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /billing/status:
    get:
      operationId: getBillingStatus
      tags: [billing]
      summary: Get the current Cadence billing status
      responses:
        "200":
          description: Current billing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
  /billing/checkout:
    post:
      operationId: createBillingCheckout
      tags: [billing]
      summary: Create an embedded Airwallex checkout for Cadence Pro
      responses:
        "201":
          description: Checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckout"
  /airwallex/webhooks:
    post:
      operationId: receiveAirwallexWebhook
      tags: [billing]
      summary: Receive and verify Airwallex billing events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AirwallexWebhookEvent"
      responses:
        "200":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookReceipt"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BillingStatus:
      type: object
      properties:
        plan:
          type: string
          enum: [starter, pro]
        status:
          type: string
        currentPeriodEnd:
          type: ["string", "null"]
          format: date-time
      required: [plan, status, currentPeriodEnd]
    BillingCheckout:
      type: object
      properties:
        checkoutId:
          type: string
        clientSecret:
          type: string
        environment:
          type: string
          enum: [demo, prod]
      required: [checkoutId, clientSecret, environment]
    AirwallexWebhookEvent:
      type: object
      additionalProperties: true
    WebhookReceipt:
      type: object
      properties:
        received:
          type: boolean
      required: [received]

