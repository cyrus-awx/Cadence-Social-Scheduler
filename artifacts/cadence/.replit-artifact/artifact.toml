kind = "web"
previewPath = "/"
title = "Cadence"
description = "A read-only fictional social scheduling sample with an April 2025 calendar and one-time $29 USD Airwallex sandbox payment."
version = "1.0.0"
id = "artifacts/cadence"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23919

[services.development]
run = "pnpm --filter @workspace/cadence run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cadence", "run", "build" ]
serve = "static"
publicDir = "artifacts/cadence/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23919"
BASE_PATH = "/"
